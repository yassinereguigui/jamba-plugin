name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per ref; newer pushes cancel in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Deterministic gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # Deterministic gate: structural validation (offline, no credentials)
      # plus JSON validity. Grows as checks are added.
      - name: Run gate
        run: make check
